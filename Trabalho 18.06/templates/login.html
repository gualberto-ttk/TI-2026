<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
body{margin:0;height:100vh;display:flex;
justify-content:center;align-items:center;
font-family:Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb,#38bdf8)}

.caixa{
width:380px;background:white;
padding:35px;border-radius:22px;text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.25)
}

h1{color:#1e40af}

input{
width:100%;padding:13px;margin:10px 0;
border:2px solid #bfdbfe;border-radius:12px;
box-sizing:border-box
}

button{width:100%;padding:13px;border:0;
border-radius:12px;background:#2563eb;color:white;
font-weight:bold;cursor:pointer}

button:hover{background:#1e40af}
a{color:#2563eb;text-decoration:none;font-weight:bold}
.erro{color:#dc2626}
</style>
</head>
<body>
<div class="caixa">

<h1>Entrar</h1>

<form method="post">
<input name="nome" placeholder="Nome" value="{{ nome }}" required>
<input name="senha" type="password" placeholder="Senha" required>
<button>Entrar</button>
</form>

<p class="erro">{{ erro }}</p>
<p>Não tem conta? <a href="/criar">Criar conta</a></p>

</div>
</body>
</html>
