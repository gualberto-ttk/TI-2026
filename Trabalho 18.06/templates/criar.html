<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Criar conta</title>
<style>
body{
margin:0;height:100vh;background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb,#38bdf8);
display:flex;align-items:center;justify-content:center;
font-family:Arial,sans-serif
}

.caixa{width:380px;background:#fff;padding:35px;
border-radius:22px;box-shadow:0 15px 40px rgba(0,0,0,.25);
text-align:center}

h1{color:#1e40af}

input{width:100%;box-sizing:border-box;
padding:13px;margin:10px 0;border-radius:12px;
border:2px solid #bfdbfe}

button{
width:100%;padding:13px;background:#2563eb;color:white;
border:0;border-radius:12px;font-weight:bold;cursor:pointer
}

button:hover{background:#1e40af}

a{color:#2563eb;text-decoration:none;font-weight:bold}
.erro{color:#dc2626}
</style>
</head>

<body>
<div class="caixa">
<h1>Criar conta</h1>

<form method="post">
<input name="nome" placeholder="Nome" required>
<input name="senha" type="password" placeholder="Senha" required>
<button>Criar</button>
</form>

<p class="erro">{{ erro }}</p>
<p>Já tem conta? <a href="/login">Entrar</a></p>
</div>
</body>
</html>
