<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Caderno de Recados</title>

<style>
*{box-sizing:border-box}

body{margin:0;min-height:100vh;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb,#38bdf8);
padding:30px}

.caixa{
max-width:900px;margin:auto;background:white;padding:35px;
border-radius:25px;box-shadow:0 20px 45px rgba(0,0,0,.25)
}

.topo{display:flex;justify-content:space-between;
align-items:center;border-bottom:2px solid #dbeafe;
padding-bottom:20px}

.topo h1{color:#1e40af;margin:0}
.topo p{color:#475569}

.sair{background:#ef4444;color:white;text-decoration:none;
padding:10px 18px;border-radius:12px;font-weight:bold}

textarea{
width:100%;height:120px;margin-top:20px;
padding:15px;border:2px solid #bfdbfe;
border-radius:15px;resize:none;font-size:15px
}

button{margin-top:15px;padding:14px 25px;border:0;
border-radius:12px;background:#2563eb;color:white;
font-weight:bold;cursor:pointer}

button:hover{background:#1e40af}

.recado{
margin-top:20px;background:#eff6ff;padding:18px;
border-radius:15px;border-left:6px solid #2563eb;
box-shadow:0 5px 15px rgba(37,99,235,.12)
}

.recado h3{margin:0;color:#1d4ed8}
.recado p{color:#334155}

.apagar{background:#ef4444;color:white;text-decoration:none;
padding:8px 12px;border-radius:10px;display:inline-block;
margin-top:10px;font-size:14px}

.vazio{text-align:center;color:#64748b;margin-top:20px}
</style>
</head>

<body>
<div class="caixa">

<div class="topo">
<div>
<h1>Caderno de Recados</h1>
<p>Olá, {{ usuario }}</p>
</div>
<a class="sair" href="/sair">Sair</a>
</div>

<form action="/recado" method="post">
<textarea name="mensagem" placeholder="Digite seu recado" required></textarea>
<button>Enviar Recado</button>
</form>

{% for r in recados %}
<div class="recado">
<h3>{{ r.nome }}</h3>
<p>{{ r.mensagem }}</p>
<a class="apagar" href="/apagar/{{ loop.index0 }}">Apagar</a>
</div>
{% else %}
<p class="vazio">Nenhum recado ainda.</p>
{% endfor %}

</div>
</body>
</html>
