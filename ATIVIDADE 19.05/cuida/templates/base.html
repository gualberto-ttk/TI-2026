<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FoodExpress 🍔</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success">
<div class="container">

<a class="navbar-brand" href="{{ url_for('index') }}">🍔 FoodExpress</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu">
<ul class="navbar-nav ms-auto">

<li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Início 🏠</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('cardapio') }}">Cardápio 🍟</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('pedidos_page') }}">Pedidos 🧾</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('cliente', nome='Ana', cidade='Natal') }}">Cliente 👤</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('contato') }}">Contato 📱</a></li>

</ul>
</div>

</div>
</nav>

<main>
{% block conteudo %}{% endblock %}
</main>

<footer class="bg-dark text-white text-center py-3 mt-5">
<p class="mb-0">FoodExpress © 2026 - Delivery fictício feito para atividade escolar 🚚</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
