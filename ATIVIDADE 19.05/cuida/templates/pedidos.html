{% extends "base.html" %}
{% block conteudo %}
<section class="container py-5">
  <h1>Pedidos</h1>
  <p>Lista de pedidos fictícios.</p>
  <table class="table table-striped table-hover shadow-sm">
    <thead class="table-success"><tr><th>Cliente</th><th>Pedido</th><th>Valor</th></tr></thead>
    <tbody>
      {% for item in pedidos %}
      <tr><td>{{ item.cliente }}</td><td>{{ item.pedido }}</td><td>{{ item.valor }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
