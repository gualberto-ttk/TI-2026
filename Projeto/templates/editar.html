{% extends "base.html" %}

{% block titulo %}Editar Vaga{% endblock %}

{% block conteudo %}

<h2 class="mb-4">Editar Vaga</h2>

<form method="POST">

    <div class="mb-3">
        <label>Título da vaga</label>
        <input type="text" name="titulo" class="form-control" value="{{ vaga.titulo }}" required>
    </div>

    <div class="mb-3">
        <label>Empresa</label>
        <input type="text" name="empresa" class="form-control" value="{{ vaga.empresa }}" required>
    </div>

    <div class="row">

        <div class="col-md-6 mb-3">
            <label>Cidade</label>
            <input type="text" name="cidade" class="form-control" value="{{ vaga.cidade }}" required>
        </div>

        <div class="col-md-6 mb-3">
            <label>Estado</label>
            <input type="text" name="estado" class="form-control" value="{{ vaga.estado }}">
        </div>

    </div>

    <div class="row">

        <div class="col-md-6 mb-3">
            <label>Modalidade</label>

            <select name="modalidade" class="form-select">

                <option {% if vaga.modalidade=="Presencial" %}selected{% endif %}>Presencial</option>

                <option {% if vaga.modalidade=="Híbrido" %}selected{% endif %}>Híbrido</option>

                <option {% if vaga.modalidade=="Remoto" %}selected{% endif %}>Remoto</option>

            </select>

        </div>

        <div class="col-md-6 mb-3">

            <label>Tipo de contrato</label>

            <select name="tipo_contrato" class="form-select">

                <option {% if vaga.tipo_contrato=="CLT" %}selected{% endif %}>CLT</option>

                <option {% if vaga.tipo_contrato=="PJ" %}selected{% endif %}>PJ</option>

                <option {% if vaga.tipo_contrato=="Estágio" %}selected{% endif %}>Estágio</option>

                <option {% if vaga.tipo_contrato=="Temporário" %}selected{% endif %}>Temporário</option>

            </select>

        </div>

    </div>

    <div class="row">

        <div class="col-md-6 mb-3">
            <label>Salário</label>
            <input type="text" name="salario" class="form-control" value="{{ vaga.salario }}">
        </div>

        <div class="col-md-6 mb-3">
            <label>E-mail para contato</label>
            <input type="email" name="contato" class="form-control" value="{{ vaga.contato }}" required>
        </div>

    </div>

    <div class="mb-3">
        <label>Descrição</label>
        <textarea name="descricao" class="form-control" rows="4" required>{{ vaga.descricao }}</textarea>
    </div>

    <div class="mb-3">
        <label>Requisitos</label>
        <textarea name="requisitos" class="form-control" rows="3">{{ vaga.requisitos }}</textarea>
    </div>

    <div class="mb-3">
        <label>Benefícios</label>
        <textarea name="beneficios" class="form-control" rows="3">{{ vaga.beneficios }}</textarea>
    </div>

    <div class="mb-4">

        <label class="mb-2">
            Tipos de deficiência aceitos:
        </label>

        {% set tipos = vaga.tipos_deficiencia %}

        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="tipos_deficiencia" value="Física"
                {% if "Física" in tipos %}checked{% endif %}>
            <label class="form-check-label">Física</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="tipos_deficiencia" value="Visual"
                {% if "Visual" in tipos %}checked{% endif %}>
            <label class="form-check-label">Visual</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="tipos_deficiencia" value="Auditiva"
                {% if "Auditiva" in tipos %}checked{% endif %}>
            <label class="form-check-label">Auditiva</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="tipos_deficiencia" value="Intelectual"
                {% if "Intelectual" in tipos %}checked{% endif %}>
            <label class="form-check-label">Intelectual</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="tipos_deficiencia" value="Múltipla"
                {% if "Múltipla" in tipos %}checked{% endif %}>
            <label class="form-check-label">Múltipla</label>
        </div>

    </div>

    <button type="submit" class="btn btn-primary">
        Salvar Alterações
    </button>

    <a href="{{ url_for('detalhes_vaga', vaga_id=vaga.id) }}" class="btn btn-secondary">
        Cancelar
    </a>

</form>

{% endblock %}
